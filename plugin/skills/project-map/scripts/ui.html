<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Map</title>
<style>
:root {
  --bg: #f5f6f8; --surface: #ffffff; --surface-2: #eef1f5; --text: #1c2230; --muted: #667085;
  --line: #d8dde6; --accent: #3a6ee8; --accent-soft: rgba(58,110,232,.12); --danger: #d64545;
  --danger-soft: rgba(214,69,69,.12); --ok: #2b8a57; --warn: #b7791f;
  --f1: #e8edf6; --f2: #dde4f0; --f3: #d1dae9; --f4: #c6d0e2;
  --k-component: #4f7cff; --k-service: #22a06b; --k-routes: #e0812a; --k-guard: #8b5cf6;
  --k-pipe: #0ea5b7; --k-store: #d9488f; --k-model: #8a94a6; --k-other: #a3abb9;
  --shadow: 0 8px 30px rgba(20,30,50,.12);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111419; --surface: #191d25; --surface-2: #212732; --text: #e6e9ef; --muted: #98a2b3;
    --line: #2e3542; --accent: #6d97ff; --accent-soft: rgba(109,151,255,.16); --danger: #f07070;
    --danger-soft: rgba(240,112,112,.16); --ok: #4cc38a; --warn: #e0a84a;
    --f1: #1c222c; --f2: #232a36; --f3: #2a3240; --f4: #323b4b; --k-model: #9aa4b6; --k-other: #7d8697;
    --shadow: 0 8px 30px rgba(0,0,0,.45);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Inter, sans-serif; display: flex; flex-direction: column; }
header { display: flex; align-items: center; gap: 16px; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
header h1 { font-size: 16px; margin: 0; font-weight: 650; white-space: nowrap; }
.crumbs { display: flex; gap: 4px; align-items: center; flex: 1; min-width: 200px; overflow: hidden; }
.crumbs button { background: none; border: 0; color: var(--accent); font: inherit; cursor: pointer; padding: 2px 4px; border-radius: 4px; }
.crumbs button:hover { background: var(--accent-soft); }
.crumbs button[disabled] { color: var(--text); font-weight: 600; cursor: default; background: none; }
.crumbs button.drop { outline: 2px dashed var(--accent); background: var(--accent-soft); }
.crumbs span { color: var(--muted); }
.search { position: relative; }
.search input { width: 240px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); color: var(--text); font: inherit; }
.search ul { position: absolute; top: 38px; left: 0; right: 0; margin: 0; padding: 4px; list-style: none; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); z-index: 20; max-height: 320px; overflow: auto; }
.search li { padding: 6px 8px; border-radius: 6px; cursor: pointer; }
.search li:hover, .search li.active { background: var(--accent-soft); }
.search li small { display: block; color: var(--muted); }
.btn { border: 1px solid var(--line); background: var(--surface); color: var(--text); padding: 7px 12px; border-radius: 8px; font: inherit; cursor: pointer; white-space: nowrap; }
.btn:hover:not([disabled]) { border-color: var(--accent); }
.btn[disabled] { opacity: .45; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.stat { color: var(--muted); white-space: nowrap; }
.stat b.bad { color: var(--danger); }
.stat b.good { color: var(--ok); }
main { flex: 1; display: flex; min-height: 0; }
#canvas { flex: 1; position: relative; min-width: 0; }
#canvas svg { width: 100%; height: 100%; display: block; }
aside { width: 360px; background: var(--surface); border-left: 1px solid var(--line); overflow: auto; padding: 16px 18px; }
aside h2 { font-size: 17px; margin: 0 0 2px; word-break: break-all; }
aside h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 18px 0 6px; }
aside .path { color: var(--muted); font-size: 12px; word-break: break-all; }
aside .purpose { margin-top: 8px; padding: 8px 10px; background: var(--surface-2); border-radius: 8px; }
aside ul { list-style: none; margin: 0; padding: 0; }
aside li { padding: 4px 0; border-bottom: 1px solid var(--line); word-break: break-all; }
aside li a { color: var(--accent); cursor: pointer; text-decoration: none; }
aside li a:hover { text-decoration: underline; }
.chip { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; color: #fff; }
.viol { background: var(--danger-soft); border-left: 3px solid var(--danger); padding: 6px 8px; border-radius: 6px; margin: 6px 0; }
.viol b { color: var(--danger); }
.hint { color: var(--muted); font-size: 13px; }
.legend { position: absolute; left: 12px; bottom: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font-size: 12px; display: flex; flex-wrap: wrap; gap: 6px 14px; max-width: calc(100% - 24px); box-shadow: var(--shadow); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.legend .tip { color: var(--muted); }
svg text { pointer-events: none; font-family: inherit; paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; }
svg text.on-color { stroke: rgba(0,0,0,.28); stroke-width: 2px; }
circle.folder { stroke: var(--line); stroke-width: 1; cursor: pointer; }
circle.file { stroke: rgba(0,0,0,.15); stroke-width: 1; cursor: grab; }
circle.bad { stroke: var(--danger) !important; stroke-width: 3 !important; }
circle.selected { stroke: var(--text) !important; stroke-width: 3 !important; }
circle.drop { stroke: var(--accent) !important; stroke-width: 3 !important; stroke-dasharray: 6 4; fill: var(--accent-soft) !important; }
circle.svc { cursor: pointer; }
circle.method { stroke: var(--k-service); stroke-width: 1.5; cursor: grab; }
circle.method.priv { stroke-dasharray: 4 3; }
circle.picked { fill: var(--accent-soft) !important; stroke: var(--accent) !important; stroke-width: 3 !important; }
.mlist label { display: flex; gap: 8px; align-items: baseline; padding: 5px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.mlist code { font: 12.5px ui-monospace, Menlo, Consolas, monospace; }
.mlist .vis { color: var(--muted); font-size: 11px; margin-left: auto; white-space: nowrap; }
.tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px; margin-right: 6px; text-transform: uppercase; letter-spacing: .03em; }
.tag.blocker { background: var(--danger); color: #fff; }
.tag.decide { background: var(--warn); color: #fff; }
.tag.info { background: var(--surface-2); color: var(--muted); }
.decision { border-left: 3px solid var(--warn); background: var(--surface-2); padding: 8px 10px; border-radius: 6px; margin: 6px 0; }
.decision.blocker { border-color: var(--danger); background: var(--danger-soft); }
.decision ul { margin: 6px 0 0 18px; padding: 0; color: var(--muted); font-size: 13px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.chips span { background: var(--surface-2); border-radius: 999px; padding: 3px 10px; font-size: 12.5px; }
.chips span.bad { background: var(--danger-soft); color: var(--danger); font-weight: 600; }
.dirline { font-size: 14px; padding: 4px 0; }
pre.task { white-space: pre-wrap; font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace; background: var(--surface-2); padding: 10px; border-radius: 8px; max-height: 260px; overflow: auto; }
.preview-note { font-size: 12px; color: var(--muted); margin-right: auto; align-self: center; }
input.name { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); color: var(--text); font: 14px ui-monospace, Menlo, Consolas, monospace; margin-top: 6px; }
circle.drop-same { stroke: var(--muted) !important; stroke-width: 2 !important; stroke-dasharray: 3 4; }
.edge { fill: none; stroke-width: 2; opacity: .8; pointer-events: none; }
.edge.out { stroke: var(--accent); }
.edge.in { stroke: var(--warn); }
.ghost circle { opacity: .85; stroke: var(--text); stroke-width: 2; }
.ghost text { font-weight: 600; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--text); color: var(--surface); padding: 10px 16px; border-radius: 10px; box-shadow: var(--shadow); display: flex; gap: 14px; align-items: center; z-index: 50; max-width: calc(100% - 32px); }
.toast button { background: none; border: 0; color: var(--surface); font: inherit; font-weight: 700; cursor: pointer; text-decoration: underline; }
.modal-bg { position: fixed; inset: 0; background: rgba(10,14,20,.45); display: flex; align-items: center; justify-content: center; z-index: 40; padding: 16px; }
.modal { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); width: min(720px, 100%); max-height: 85vh; display: flex; flex-direction: column; }
.modal header { border-radius: 14px 14px 0 0; }
.modal .body { padding: 16px 18px; overflow: auto; }
.modal .body h4 { margin: 14px 0 6px; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.modal .body h4:first-child { margin-top: 0; }
.modal code { font: 12.5px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace; word-break: break-all; }
.modal .row { padding: 5px 0; border-bottom: 1px solid var(--line); }
.modal .from { color: var(--danger); text-decoration: line-through; opacity: .8; }
.modal .to { color: var(--ok); }
.modal footer { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--line); }
.error { color: var(--danger); }
#carry { position: fixed; top: 64px; left: 50%; transform: translateX(-50%); background: var(--accent); color: #fff; padding: 8px 10px 8px 16px; border-radius: 10px; box-shadow: var(--shadow); display: flex; gap: 12px; align-items: center; z-index: 30; max-width: calc(100% - 32px); }
#carry[hidden] { display: none; }
#carry button { background: rgba(255,255,255,.2); border: 0; color: #fff; padding: 5px 10px; border-radius: 6px; font: inherit; cursor: pointer; }
.actions { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
@media (max-width: 900px) {
  main { flex-direction: column; }
  #canvas { min-height: 60vh; }
  aside { width: auto; border-left: 0; border-top: 1px solid var(--line); }
  .search input { width: 160px; }
}
</style>
</head>
<body>
<header>
  <h1>Project map</h1>
  <nav class="crumbs" id="crumbs"></nav>
  <div class="search">
    <input id="search" placeholder="Find file or folder…" autocomplete="off">
    <ul id="results" hidden></ul>
  </div>
  <span class="stat" id="stats"></span>
  <button class="btn" id="undo" disabled title="Undo the last move">Undo</button>
</header>
<main>
  <div id="canvas">
    <svg id="svg"></svg>
    <div class="legend" id="legend"></div>
  </div>
  <aside id="panel"></aside>
</main>
<div id="carry" hidden></div>
<div id="modal"></div>
<div id="toast"></div>

<script src="/vendor/d3.min.js"></script>
<script>
const KIND_COLOR = {
  component: 'var(--k-component)', service: 'var(--k-service)', routes: 'var(--k-routes)',
  guard: 'var(--k-guard)', interceptor: 'var(--k-guard)', resolver: 'var(--k-guard)',
  pipe: 'var(--k-pipe)', directive: 'var(--k-pipe)', store: 'var(--k-store)',
  model: 'var(--k-model)', config: 'var(--k-other)', module: 'var(--k-routes)', other: 'var(--k-other)',
  // Spring Boot (Java)
  controller: 'var(--k-component)', repository: 'var(--k-routes)', entity: 'var(--k-store)', dto: 'var(--k-pipe)',
  mapper: 'var(--k-pipe)', listener: 'var(--k-guard)', component: 'var(--k-other)', application: 'var(--k-guard)',
  exception: 'var(--k-model)', interface: 'var(--k-model)',
};
const SPRING = () => DATA && DATA.framework === 'spring';
const FOLDER_FILL = ['transparent', 'var(--f1)', 'var(--f2)', 'var(--f3)', 'var(--f4)'];
const svg = d3.select('#svg');
const layer = svg.append('g');
const gCircles = layer.append('g');
const gEdges = layer.append('g').style('pointer-events', 'none'); // lines never block clicks or drags
const gLabels = layer.append('g');
const gGhost = layer.append('g').attr('class', 'ghost');

let DATA, root, focus, view, selected = null, W = 0, H = 0;
let byPath = new Map(), importedBy = new Map(), violationsByFile = new Map();
let picked = new Set(), pickedService = null; // selected methods inside one service
const isService = (d) => d && d.data.type === 'file' && !!(d.children && d.children.length);
const isMethod = (d) => d && d.data.type === 'method';
const isServiceFile = (d) => d && d.data.type === 'file' && !!(DATA.services || {})[d.data.path]; // any @Injectable, even without methods
const isContainer = (d) => d && (d.data.type === 'folder' || isService(d));

// ---------- data ----------
async function api(method, url, body) {
  const r = await fetch(url, { method, headers: { 'content-type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  const json = await r.json();
  if (!r.ok) throw new Error((json.errors || ['Request failed']).join('\n'));
  return json;
}

function buildHierarchy(data) {
  importedBy = new Map(); violationsByFile = new Map();
  for (const f of data.files) for (const t of f.imports) {
    if (!importedBy.has(t)) importedBy.set(t, []);
    importedBy.get(t).push(f.path);
  }
  for (const v of data.violations) {
    if (!violationsByFile.has(v.file)) violationsByFile.set(v.file, []);
    violationsByFile.get(v.file).push(v);
  }
  const rootNode = { name: data.root, path: '', type: 'folder', children: [] };
  const folders = new Map([['', rootNode]]);
  const ensure = (p) => {
    if (folders.has(p)) return folders.get(p);
    const parent = ensure(p.includes('/') ? p.slice(0, p.lastIndexOf('/')) : '');
    const node = { name: p.split('/').pop(), path: p, type: 'folder', children: [] };
    parent.children.push(node); folders.set(p, node);
    return node;
  };
  for (const p of Object.keys(data.folderInfo || {})) ensure(p);
  for (const f of data.files) {
    const dir = f.path.includes('/') ? f.path.slice(0, f.path.lastIndexOf('/')) : '';
    const node = { ...f, label: f.path.split('/').pop(), type: 'file' };
    const svc = (data.services || {})[f.path];
    if (svc) { node.className = svc.className; node.fields = svc.fields; }
    if (svc && svc.methods.length) {
      node.children = svc.methods.map((m) => ({ ...m, type: 'method', label: m.name + '()', path: f.path + '#' + m.name, service: f.path }));
    }
    ensure(dir).children.push(node);
  }
  // a folder with only one subfolder and no files becomes one bubble: src/main/java/com/acme
  const collapse = (node) => {
    for (const c of node.children || []) {
      if (c.type !== 'folder') continue;
      while (c.children.length === 1 && c.children[0].type === 'folder') {
        const only = c.children[0];
        c.name = `${c.name}/${only.name}`; c.path = only.path; c.children = only.children;
      }
      collapse(c);
    }
  };
  collapse(rootNode);
  const h = d3.hierarchy(rootNode)
    .sum((d) => d.type === 'method' ? 0.45 + Math.min(d.lines || 1, 30) / 40
      : d.type === 'file' ? (d.children ? 0 : 1 + Math.min((importedBy.get(d.path) || []).length, 6) * 0.3)
      : (d.children.length ? 0 : 0.6))
    .sort((a, b) => (a.data.type === b.data.type ? a.data.name.localeCompare(b.data.name) : a.data.type === 'folder' ? -1 : 1));
  d3.pack().size([1000, 1000]).padding((d) => (d.depth === 0 ? 16 : d.depth === 1 ? 26 : d.depth === 2 ? 20 : 14))(h);
  h.each((d) => {
    // free space between the top of a folder and its highest child, in layout units
    d.topGap = d.children ? Math.min(...d.children.map((c) => c.y - c.r)) - (d.y - d.r) : d.r * 2;
    d.violations = d.data.type === 'method' ? [] : d.data.type === 'file' ? (violationsByFile.get(d.data.path) || []) :
      d.descendants().filter((l) => l.data.type === 'file').flatMap((l) => violationsByFile.get(l.data.path) || []);
  });
  return h;
}

function load(data, keepFocusPath, selectPath) {
  const first = !DATA;
  DATA = data;
  if (first) legend();
  root = buildHierarchy(data);
  byPath = new Map(root.descendants().map((d) => [d.data.path, d]));
  focus = byPath.get(keepFocusPath) || root;
  if (pickedService && !byPath.has(pickedService)) { picked = new Set(); pickedService = null; }
  while (!focus.children) focus = focus.parent;
  selected = selectPath && byPath.get(selectPath) ? byPath.get(selectPath) : (focus === root ? null : focus);
  view = [focus.x, focus.y, focus.r * 2 + 20];
  render();
  zoomTo(view);
  updateChrome();
  showPanel(selected);
}

// ---------- rendering ----------
function visibleDepth(d) { return isInFocus(d) && d.depth <= focus.depth + 3; }
function isInFocus(d) { let n = d; while (n) { if (n === focus) return true; n = n.parent; } return false; }
function interactive(d) { return d !== root && isInFocus(d) && d.depth > focus.depth && d.depth <= focus.depth + 2; }

function render() {
  const nodes = root.descendants().filter((d) => d !== root);
  gCircles.selectAll('circle').data(nodes, (d) => d.data.path).join('circle')
    .attr('class', (d) => [d.data.type, isService(d) ? 'svc' : '', isMethod(d) && d.data.visibility !== 'public' ? 'priv' : '',
      d.data.type === 'file' && d.violations.length ? 'bad' : '', d === selected ? 'selected' : ''].join(' '))
    .attr('fill', (d) => isMethod(d) ? 'var(--surface)'
      : isService(d) ? `color-mix(in srgb, ${KIND_COLOR[d.data.kind] || 'var(--k-service)'} 20%, var(--surface))`
      : d.data.type === 'file' ? KIND_COLOR[d.data.kind] || KIND_COLOR.other : FOLDER_FILL[Math.min(d.depth, 4)])
    .on('click', onClick)
    .call(drag);
  gLabels.selectAll('g.lbl').data(root.descendants().filter((d) => d !== root), (d) => d.data.path).join((enter) => {
    const g = enter.append('g').attr('class', 'lbl');
    g.append('text').attr('class', 'name');
    g.append('text').attr('class', 'sub');
    return g;
  });
  applyVisibility();
  drawEdges();
}

function applyVisibility() {
  gCircles.selectAll('circle')
    .style('display', (d) => (visibleDepth(d) ? null : 'none'))
    .style('opacity', (d) => (d.depth > focus.depth + 2 ? 0.5 : 1))
    .style('pointer-events', (d) => (interactive(d) ? null : 'none'))
    .classed('selected', (d) => d === selected)
    .classed('picked', (d) => isMethod(d) && d.data.service === pickedService && picked.has(d.data.name));
}

function labelText(d) {
  if (d.data.type === 'folder') return d.data.name + '/';
  if (isMethod(d)) return d.data.label;
  return d.data.label.replace(/\.(ts|java)$/, '');
}

function zoomTo(v) {
  view = v;
  const k = Math.min(W, H) / v[2];
  gCircles.selectAll('circle')
    .attr('cx', (d) => (d.x - v[0]) * k + W / 2)
    .attr('cy', (d) => (d.y - v[1]) * k + H / 2)
    .attr('r', (d) => Math.max(0, d.r * k));
  gLabels.selectAll('g.lbl').each(function (d) {
    const r = d.r * k, x = (d.x - v[0]) * k + W / 2, y = (d.y - v[1]) * k + H / 2;
    const g = d3.select(this);
    const rel = d.depth - focus.depth;
    const near = rel === 1 || rel === 2 || (rel === 3 && d.data.type === 'file');
    const show = visibleDepth(d) && near && r > (d.data.type === 'folder' ? (rel === 1 ? 34 : 56) : 24);
    g.style('display', show ? null : 'none');
    if (!show) return;
    const isFolder = isContainer(d);
    const fs = isFolder ? Math.min(15, 11 + r / 40) : Math.min(13, 9 + r / 18);
    const maxChars = Math.max(4, Math.floor((r * 1.8) / (fs * 0.58)));
    let text = labelText(d);
    if (text.length > maxChars) text = text.slice(0, maxChars - 1) + '…';
    const hasKids = isFolder && d.children && d.children.length;
    const gap = hasKids ? d.topGap * k : Infinity;
    // Not enough room inside? Put the name just above the bubble instead of on top of its children.
    const ty = hasKids ? (gap < fs + 4 ? y - r - 5 : y - r + Math.min(gap, fs + 8) - 2) : y + (isFolder ? 0 : fs * 0.35);
    g.select('text.name').attr('x', x).attr('y', ty).attr('text-anchor', 'middle')
      .attr('font-size', fs).attr('font-weight', isFolder ? 650 : 550)
      .attr('fill', isFolder || isMethod(d) ? 'var(--text)' : '#fff').classed('on-color', !isFolder && !isMethod(d)).text(text);
    const sub = isFolder ? folderSub(d) : '';
    const subFits = !hasKids || gap > fs + 26;
    g.select('text.sub').attr('x', x).attr('y', ty + fs + 2).attr('text-anchor', 'middle')
      .attr('font-size', 11).attr('fill', d.violations.length ? 'var(--danger)' : 'var(--muted)')
      .style('display', sub && subFits && r > 60 ? null : 'none').text(sub);
  });
  drawEdges();
}

function folderSub(d) {
  if (isService(d)) return `${d.children.length} method${d.children.length === 1 ? '' : 's'}`;
  const files = d.descendants().filter((l) => l.data.type === 'file').length;
  const v = d.violations.length;
  return `${files} file${files === 1 ? '' : 's'}${v ? ` · ${v} issue${v === 1 ? '' : 's'}` : ''}`;
}

function screenPos(d) {
  const k = Math.min(W, H) / view[2];
  return [(d.x - view[0]) * k + W / 2, (d.y - view[1]) * k + H / 2];
}
function visibleAncestor(d) {
  let n = d;
  while (n && !(visibleDepth(n) && n !== root)) n = n.parent;
  return n;
}

function drawEdges() {
  const edges = [];
  if (selected && selected.data.type === 'file' && selected !== focus) {
    for (const t of selected.data.imports) edges.push({ a: selected, b: byPath.get(t), dir: 'out' });
    for (const s of importedBy.get(selected.data.path) || []) edges.push({ a: byPath.get(s), b: selected, dir: 'in' });
  }
  const paths = edges.filter((e) => e.a && e.b).map((e) => {
    const a = visibleAncestor(e.a) || e.a, b = visibleAncestor(e.b) || e.b;
    const [x1, y1] = screenPos(a), [x2, y2] = screenPos(b);
    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2, dx = x2 - x1, dy = y2 - y1;
    return { d: `M${x1},${y1} Q${mx - dy * 0.2},${my + dx * 0.2} ${x2},${y2}`, dir: e.dir, key: e.a.data.path + '>' + e.b.data.path };
  });
  gEdges.selectAll('path').data(paths, (p) => p.key).join('path')
    .attr('class', (p) => 'edge ' + p.dir).attr('d', (p) => p.d).attr('marker-end', (p) => `url(#arrow-${p.dir})`);
}

function zoomToNode(d, duration = 650) {
  focus = d;
  applyVisibility();
  const target = [d.x, d.y, d.r * 2 + 20];
  svg.transition().duration(duration).tween('zoom', () => {
    const i = d3.interpolateZoom(view, target);
    return (t) => zoomTo(i(t));
  });
  updateChrome();
}

// ---------- interaction ----------
function onClick(event, d) {
  if (event.defaultPrevented) return;
  event.stopPropagation();
  // Drill down exactly one level: a click inside a child folder opens that child, not a grandchild.
  // Files are always selected directly.
  if (isContainer(d) && d.depth > focus.depth + 1 && isInFocus(d)) {
    let top = d;
    while (top.depth > focus.depth + 1) top = top.parent;
    if (isContainer(top)) d = top;
  }
  if (isMethod(d)) {
    // Inside the open service a click selects/deselects; from further out it opens the service first.
    if (focus !== d.parent) { picked = new Set([d.data.name]); pickedService = d.parent.data.path; selected = d.parent; zoomToNode(d.parent); }
    else togglePick(d);
    applyVisibility(); showPanel(selected);
    return;
  }
  if (isContainer(d)) {
    if (isService(d) && pickedService !== d.data.path) { picked = new Set(); pickedService = d.data.path; }
    selected = d; zoomToNode(d);
  }
  else {
    selected = d;
    if (!isInFocus(d) || d.depth > focus.depth + 2) zoomToNode(d.parent);
    applyVisibility(); drawEdges();
  }
  showPanel(selected);
}
svg.on('click', () => {
  if (focus.parent) { selected = focus.parent === root ? null : focus.parent; zoomToNode(focus.parent); showPanel(selected); }
});
window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && carry) { stopCarry(); return; }
  if (e.key === 'Escape' && !document.querySelector('.modal-bg') && focus.parent) {
    selected = focus.parent === root ? null : focus.parent; zoomToNode(focus.parent); showPanel(selected);
  }
});

function togglePick(d) {
  if (pickedService !== d.data.service) { picked = new Set(); pickedService = d.data.service; }
  if (picked.has(d.data.name)) picked.delete(d.data.name); else picked.add(d.data.name);
  selected = d.parent;
}

function locate(path) {
  const d = byPath.get(path);
  if (!d) return;
  selected = d;
  if (isMethod(d)) { picked = new Set([d.data.name]); pickedService = d.data.service; selected = d.parent; zoomToNode(d.parent); showPanel(d.parent); return; }
  zoomToNode(isContainer(d) ? d : d.parent);
  showPanel(d);
}

// ---------- drag and drop ----------
let dragState = null;
const drag = d3.drag()
  .filter((event, d) => !event.button && d !== root && interactive(d))
  .subject((event) => ({ x: event.x, y: event.y }))
  .clickDistance(6)
  .on('start', (event, d) => {
    dragState = { node: d, target: null, moved: false };
    if (isMethod(d)) dragState.methods = pickedService === d.data.service && picked.has(d.data.name) ? [...picked] : [d.data.name];
  })
  .on('drag', (event, d) => {
    if (!dragState.moved) {
      dragState.moved = true;
      const k = Math.min(W, H) / view[2];
      const r = Math.min(40, Math.max(14, d.r * k));
      gGhost.selectAll('*').remove();
      const ms = dragState.methods;
      gGhost.append('circle').attr('r', ms ? 18 : r).attr('fill', ms ? 'var(--accent-soft)' : d.data.type === 'file' ? KIND_COLOR[d.data.kind] : 'var(--f3)');
      gGhost.append('text').attr('y', (ms ? 18 : r) + 16).attr('text-anchor', 'middle').attr('font-size', 13).attr('fill', 'var(--text)')
        .text(ms ? (ms.length === 1 ? ms[0] + '()' : `${ms.length} methods`) : labelText(d));
    }
    gGhost.attr('transform', `translate(${event.x},${event.y})`);
    const t = folderAt(event.x, event.y, d, event.sourceEvent, !!dragState.methods);
    dragState.target = t;
    gCircles.selectAll('circle').classed('drop', (c) => c === t && t !== d.parent).classed('drop-same', (c) => c === t && t === d.parent);
  })
  .on('end', (event, d) => {
    gGhost.selectAll('*').remove();
    gCircles.selectAll('circle').classed('drop', false).classed('drop-same', false);
    document.querySelectorAll('#crumbs button').forEach((b) => b.classList.remove('drop'));
    const t = dragState && dragState.target;
    const moved = dragState && dragState.moved;
    const ms = dragState && dragState.methods;
    dragState = null;
    if (!moved || !t || t === d.parent) return;
    if (ms) methodsDropped(d.parent, ms, t);
    else previewMove(d, t);
  });

function folderAt(x, y, dragged, sourceEvent, forMethods) {
  const accepts = (n) => n.data.type === 'folder' || (forMethods && isServiceFile(n) && n !== dragged.parent);
  // 1) A breadcrumb item under the pointer: drop into that folder (works for any parent level).
  const se = sourceEvent && (sourceEvent.touches ? sourceEvent.touches[0] : sourceEvent);
  document.querySelectorAll('#crumbs button').forEach((b) => b.classList.remove('drop'));
  if (se) {
    const el = document.elementFromPoint(se.clientX, se.clientY);
    const btn = el && el.closest && el.closest('#crumbs button');
    if (btn) {
      const n = byPath.get(btn.dataset.p);
      if (n && n !== dragged && !isAncestorOf(dragged, n) && accepts(n)) { btn.classList.add('drop'); return n; }
      return null;
    }
  }
  // 2) Otherwise the deepest visible folder bubble under the pointer (never a hidden or off-screen one).
  const k = Math.min(W, H) / view[2];
  let best = null;
  root.each((n) => {
    if (!accepts(n) || !visibleDepth(n)) return;
    if (n === dragged || isAncestorOf(dragged, n)) return;
    const [cx, cy] = screenPos(n);
    if (Math.hypot(x - cx, y - cy) <= n.r * k && (!best || n.depth > best.depth)) best = n;
  });
  return best;
}
function isAncestorOf(a, b) { let n = b.parent; while (n) { if (n === a) return true; n = n.parent; } return false; }

// ---------- move preview ----------
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const short = (p) => (DATA && p.startsWith(DATA.root + '/') ? p.slice(DATA.root.length + 1) : p.replace(/^src\/app\//, ''));

async function previewMove(node, target) {
  const body = { source: node.data.path, target: target.data.path };
  const what = node.data.type === 'file' ? node.data.label : node.data.name + '/';
  const where = (target.data.path || DATA.root) + '/';
  openModal(`<header><h1>Move ${esc(what)} → ${esc(where)}</h1></header><div class="body"><p class="hint">Preparing preview…</p></div>`);
  let plan;
  try { plan = await api('POST', '/api/plan', body); }
  catch (e) {
    return openModal(`<header><h1>Can't move ${esc(what)}</h1></header><div class="body"><p class="error">${esc(e.message)}</p></div>
      <footer><button class="btn" data-close>Close</button></footer>`);
  }
  const moves = plan.moves.map((m) => `<div class="row"><code class="from">${esc(short(m.from))}</code><br><code class="to">${esc(short(m.to))}</code></div>`).join('');
  const change = (c) => c.from === '(added)' ? `<br><span class="tag info">added</span><code class="to">${esc(c.to)}</code>`
    : c.to.startsWith('(removed') ? `<br><span class="tag info">removed</span><code class="from">${esc(c.from)}</code> <span class="hint">${esc(c.to.replace(/^\(removed: ?|\)$/g, ''))}</span>`
    : `<br><code class="from">${esc(c.from)}</code> → <code class="to">${esc(c.to)}</code>`;
  const edits = plan.edits.map((e) => `<div class="row"><code>${esc(short(e.file))}</code>${e.changes.map(change).join('')}</div>`).join('');
  const warn = plan.warnings.map((w) => `<div class="viol"><b>Check:</b> ${esc(w)}</div>`).join('');
  const issues = node.violations.length ? `<div class="viol"><b>${node.violations.length} rule issue${node.violations.length > 1 ? 's' : ''}</b> on this ${node.data.type} today. The map re-checks the rules after the move.</div>` : '';
  openModal(`<header><h1>Move ${esc(what)} → ${esc(where)}</h1></header>
    <div class="body">${issues}${warn}
      <h4>${plan.moves.length} file${plan.moves.length === 1 ? '' : 's'} to move</h4>${moves}
      <h4>${plan.importCount} import${plan.importCount === 1 ? '' : 's'} to rewrite</h4>${edits || '<p class="hint">No imports point to these files.</p>'}
    </div>
    <footer><button class="btn" data-close>Cancel</button><button class="btn primary" id="confirm">Move files</button></footer>`);
  document.getElementById('confirm').onclick = async () => {
    document.getElementById('confirm').disabled = true;
    try {
      const before = DATA.violations.length;
      const res = await api('POST', '/api/move', body);
      closeModal();
      const newPath = (target.data.path ? target.data.path + '/' : '') + (node.data.type === 'file' ? node.data.label : node.data.name);
      load(res.map, target.data.path, newPath);
      const after = res.map.violations.length;
      toast(`Moved ${res.result.moves.length} file${res.result.moves.length === 1 ? '' : 's'} · ${res.result.importCount} import${res.result.importCount === 1 ? '' : 's'} rewritten · issues ${before} → ${after}`, true);
    } catch (e) {
      openModal(`<header><h1>Move failed</h1></header><div class="body"><p class="error">${esc(e.message)}</p></div><footer><button class="btn" data-close>Close</button></footer>`);
    }
  };
}

// ---------- method move preview (analysis only, nothing is changed) ----------
function suggestServiceName(serviceNode, methods) {
  const base = (serviceNode.data.className || 'Feature').replace(/Service$/, '');
  const word = (methods[0].match(/^[a-z]+/) || ['Extra'])[0];
  return base + word[0].toUpperCase() + word.slice(1) + 'Service';
}
function methodsDropped(serviceNode, methods, target) {
  if (isServiceFile(target)) return previewMethodMove(serviceNode, methods, { file: target.data.path }, target.data.className);
  const folder = target || root;
  openModal(`<header><h1>New service in ${esc((folder.data.path || DATA.root) + '/')}</h1></header>
    <div class="body"><p>Name of the new service for ${methods.length === 1 ? `<code>${esc(methods[0])}()</code>` : methods.length + ' methods'}:</p>
    <input class="name" id="svcName" value="${esc(suggestServiceName(serviceNode, methods))}" spellcheck="false"></div>
    <footer><button class="btn" data-close>Cancel</button><button class="btn primary" id="svcOk">Show impact</button></footer>`);
  const input = document.getElementById('svcName');

  const go = () => previewMethodMove(serviceNode, methods, { folder: folder.data.path, className: input.value.trim() }, input.value.trim() + ' (new)');
  document.getElementById('svcOk').onclick = go;
  input.onkeydown = (e) => { if (e.key === 'Enter') go(); };
}

async function previewMethodMove(serviceNode, methods, target, targetLabel) {
  const title = `Move ${methods.length === 1 ? methods[0] + '()' : methods.length + ' methods'} → ${targetLabel}`;
  openModal(`<header><h1>${esc(title)}</h1></header><div class="body"><p class="hint">${SPRING() ? 'Analyzing the Java code…' : 'Analyzing with the TypeScript compiler…'}</p></div>`);
  let p;
  try { p = await api('POST', '/api/methods/plan', { source: serviceNode.data.path, methods, target }); }
  catch (e) {
    return openModal(`<header><h1>${esc(title)}</h1></header><div class="body"><p class="error">${esc(e.message)}</p></div><footer><button class="btn" data-close>Close</button></footer>`);
  }
  const s = p.summary;
  const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
  const chips = [plural(s.methods, 'method'), s.helpers ? `${plural(s.helpers, 'helper')} move along` : '',
    `${plural(s.callSites, 'call site')} in ${plural(s.callerFiles, 'file')}`, s.specFiles ? plural(s.specFiles, 'test file') : '',
    s.blockers ? `<b>${plural(s.blockers, 'blocker')}</b>` : '', s.decide ? plural(s.decide, 'decision') : '']
    .filter(Boolean).map((c) => `<span class="${c.startsWith('<b>') ? 'bad' : ''}">${c}</span>`).join('');
  const decisions = p.decisions.map((d) => `<div class="decision ${d.severity}"><span class="tag ${d.severity}">${d.severity === 'blocker' ? 'Blocker' : 'Decide'}</span>${esc(d.message)}
    ${d.options ? `<ul>${d.options.map((o) => `<li>${esc(o)}</li>`).join('')}</ul>` : ''}</div>`).join('');
  const sig = p.methods.map((m) => `<div class="row"><code>${esc(m.signature || m.name)}</code></div>`).join('');
  const along = [...p.movesAlong.helpers.map((h) => `<div class="row"><span class="tag info">helper</span><code>${esc(h.signature || h.name)}</code></div>`),
    ...p.movesAlong.state.map((x) => `<div class="row"><span class="tag info">state</span><code>${esc(x.field)}${x.init ? ' = ' + esc(x.init) : ''}</code></div>`)].join('');
  const deps = p.dependencies.map((d) => `<div class="row"><code>${esc(d.token)}</code> — ${d.alreadyInTarget ? 'already injected in the target' : 'inject in the target'}${d.stillUsedInSource ? '' : `; <span class="hint">no longer needed in ${esc(p.source.className)}</span>`}</div>`).join('');
  const callers = p.methods.flatMap((m) => [
    ...m.callers.map((c) => `<div class="row"><code>${esc(short(c.file))}:${c.line}</code><br><code class="hint">${esc(c.text)}</code></div>`),
    ...m.templateUses.map((c) => `<div class="row"><span class="tag info">template</span><code>${esc(short(c.file))}:${c.line}</code><br><code class="hint">${esc(c.text)}</code></div>`),
  ]).join('');
  const specs = [...new Set(p.methods.flatMap((m) => m.specMentions.map((c) => c.file)))].map((f) => `<div class="row"><code>${esc(short(f))}</code></div>`).join('');
  const internal = p.methods.filter((m) => m.internalCallers.length).map((m) => `<div class="row"><code>${esc(m.name)}</code> is still called by ${esc(m.internalCallers.join(', '))} in ${esc(p.source.className)}</div>`).join('');
  const dir = p.direction;
  const dirHtml = `<div class="dirline">${dir.sourceNeedsTarget ? `${esc(p.source.className)} → ${esc(p.target.className)} <span class="hint">(${esc(dir.sourceWhy)})</span>` : `${esc(p.source.className)} does not need ${esc(p.target.className)}`}</div>
    <div class="dirline">${dir.targetNeedsSource ? `${esc(p.target.className)} → ${esc(p.source.className)} <span class="hint">(${esc(dir.targetWhy)})</span>` : `${esc(p.target.className)} does not need ${esc(p.source.className)}`}</div>
    ${dir.cycle ? '<div class="viol"><b>Circular dependency</b> if moved as is.</div>' : ''}`;
  openModal(`<header><h1>${esc(title)}</h1></header>
    <div class="body">
      <div class="chips">${chips}</div>
      ${decisions ? `<h4>Needs a decision first</h4>${decisions}` : ''}
      <h4>Methods that move</h4>${sig}
      ${along ? `<h4>Moves along automatically</h4>${along}` : ''}
      ${deps ? `<h4>${esc(p.target.className)} needs</h4>${deps}` : ''}
      <h4>Callers to update</h4>${callers || '<p class="hint">No callers outside the service.</p>'}${internal}
      ${specs ? `<h4>${SPRING() ? 'Tests that call or mock these methods' : 'Test mocks that mention these methods'}</h4>${specs}` : ''}

const search = document.getElementById('search'), results = document.getElementById('results');

  const q = search.value.trim().toLowerCase();

function carryAction(folder) {

    if (n.data.type === 'folder') return `<div class="actions"><button class="btn primary" id="methodsNew">Create a new service here…</button></div>`;
    return '';
  }
  if (!carry || folder === carry || isAncestorOf(carry, folder) || carry.parent === folder) return '';
  if ((folder || root).data.type !== 'folder') return ''; // files and folders only move into folders
  return `<div class="actions"><button class="btn primary" id="moveHere">Move ${esc(labelText(carry))} here</button></div>`;
}
function bindActions(d) {
  const mh2 = document.getElementById('methodsHere');
  if (mh2) mh2.onclick = () => { const c = carry; stopCarry(); methodsDropped(c.service, c.methods, d); };
  const mn = document.getElementById('methodsNew');
  if (mn) mn.onclick = () => { const c = carry; stopCarry(); methodsDropped(c.service, c.methods, d || root); };
  const mc = document.getElementById('methodsCarry');
  if (mc) mc.onclick = () => startMethodCarry(d, [...picked]);
  document.querySelectorAll('.mlist input[type=checkbox]').forEach((cb) => (cb.onchange = () => {
    if (pickedService !== d.data.path) { picked = new Set(); pickedService = d.data.path; }
    if (cb.checked) picked.add(cb.value); else picked.delete(cb.value);
    applyVisibility(); showPanel(d);
  }));
  const mh = document.getElementById('moveHere');
  if (mh) mh.onclick = () => { const c = carry; stopCarry(); previewMove(c, d || root); };
  const pk = document.getElementById('pickUp');
  if (pk) pk.onclick = () => startCarry(d);
}

// ---------- branch report (this branch vs main) ----------
function branchSection() {
  const b = DATA.branch;
  if (!b || !b.available) return b && b.note ? `<h3>This branch</h3><p class="hint">${esc(b.note)}</p>` : '';
  const vs = b.source === 'merge-base' ? `${esc(b.base)} at ${esc(b.mergeBase)}${b.ahead ? ` · ${b.ahead} newer commit${b.ahead === 1 ? '' : 's'} on ${esc(b.base)}` : ''}` : 'the committed main map';
  const issue = (x, cls) => `<div class="viol" ${cls === 'ok' ? 'style="border-color:var(--ok);background:var(--surface-2)"' : ''}><b ${cls === 'ok' ? 'style="color:var(--ok)"' : ''}>${cls === 'ok' ? 'Fixed: ' : 'New: '}${esc(x.rule)}</b><br>${fileLink(x.file)}<br><span class="hint">${esc(x.detail)}</span></div>`;
  return `<h3>Branch ${esc(b.branch || '')} vs ${vs}</h3>
    <div class="chips"><span>${b.added.length} added</span><span>${b.moved.length} moved</span><span>${b.deleted.length} deleted</span><span>${b.modified.length} modified</span>
    <span class="${b.newIssues.length ? 'bad' : ''}">${b.newIssues.length} new issue${b.newIssues.length === 1 ? '' : 's'}</span>${b.fixedIssues.length ? `<span>${b.fixedIssues.length} fixed</span>` : ''}</div>
    ${b.newIssues.map((x) => issue(x, 'bad')).join('')}${b.fixedIssues.map((x) => issue(x, 'ok')).join('')}`;
}

// ---------- side panel ----------
function fileLink(p) { return `<a data-loc="${esc(p)}">${esc(p)}</a>`; }
function showPanel(d) {
  const el = document.getElementById('panel');
  if (isMethod(d)) d = d.parent;
  if (!d) {
    const v = DATA.violations;
    const areas = Object.entries(DATA.areas || {}).map(([a, deps]) => `<li><b>${esc(a)}</b> → ${esc(deps.join(', ') || '(none)')}</li>`).join('');
    el.innerHTML = `<h2>${esc(DATA.root)}</h2><div class="path">${DATA.files.length} source files</div>${carryAction(root)}
      ${branchSection()}
      <h3>Rule issues (${v.length})</h3>
      ${v.length ? v.map((x) => `<div class="viol"><b>${esc(x.rule)}</b><br>${fileLink(x.file)}<br><span class="hint">${esc(x.detail)}</span></div>`).join('') : '<p class="hint">None. The structure follows all rules.</p>'}
      <h3>Dependencies between areas</h3><ul>${areas}</ul>
      <h3>How to use</h3><p class="hint">Click a folder to drill down, the background to go up. Click a file to see what it imports (blue) and what imports it (orange). Drag a file or folder onto another folder to move it: you get a preview of every file and import that will change before anything happens.</p>`;
  } else if (d.data.type === 'folder') {
    const info = (DATA.folderInfo || {})[d.data.path];
    const kids = (d.children || []).map((c) => `<li>${fileLink(c.data.path)}${c.data.type === 'folder' ? '/' : ''}</li>`).join('');
    el.innerHTML = `<h2>${esc(d.data.name)}/</h2><div class="path">${esc(DATA.root)}/${esc(d.data.path)}</div>
      ${info && info.purpose ? `<div class="purpose">${esc(info.purpose)}${info.owner ? `<br><span class="hint">Owner: ${esc(info.owner)}</span>` : ''}</div>` : '<p class="hint">No purpose described yet. Add it in project-map.config.mjs.</p>'}
      ${carry ? carryAction(d) : '<div class="actions"><button class="btn" id="pickUp">Move to another folder…</button></div>'}
      ${d.violations.length ? `<h3>Rule issues inside (${d.violations.length})</h3>` + d.violations.map((x) => `<div class="viol"><b>${esc(x.rule)}</b><br>${fileLink(x.file)}</div>`).join('') : ''}
      <h3>Contains</h3><ul>${kids || '<li class="hint">Empty folder</li>'}</ul>`;
  } else if (isService(d)) {
    const f = d.data;
    const info = (DATA.folderInfo || {})[d.parent.data.path];
    const mine = pickedService === f.path ? picked : new Set();
    const rows = d.children.map((m) => `<label><input type="checkbox" value="${esc(m.data.name)}" ${mine.has(m.data.name) ? 'checked' : ''}>
      <code>${esc(m.data.name)}()</code><span class="vis">${esc(m.data.visibility)} · ${m.data.lines} line${m.data.lines === 1 ? '' : 's'}</span></label>`).join('');
    const deps = (f.fields || []).filter((x) => x.kind === 'dependency').map((x) => x.token);
    el.innerHTML = `<h2>${esc(f.className)}</h2><div class="path">${esc(DATA.root)}/${esc(f.path)}</div>
      ${info && info.purpose ? `<div class="purpose"><span class="hint">Folder:</span> ${esc(info.purpose)}</div>` : ''}
      ${carry ? carryAction(d) : ''}
      ${deps.length ? `<p class="hint">Injects: ${esc(deps.join(', '))}</p>` : ''}
      <h3>Methods (${d.children.length}) · ${mine.size} selected</h3>
      <div class="mlist">${rows}</div>
      ${!carry && mine.size ? `<div class="actions"><button class="btn primary" id="methodsCarry">Move ${mine.size} selected to…</button></div>
        <p class="hint">Or drag a selected bubble onto another service, a folder, or a breadcrumb.</p>` : (!carry ? '<p class="hint">Select the methods to move, by clicking their bubbles or ticking them here.</p>' : '')}
      ${carry ? '' : '<div class="actions"><button class="btn" id="pickUp">Move file to another folder…</button></div>'}
      ${d.violations.map((x) => `<div class="viol"><b>${esc(x.rule)}</b><br>${esc(x.detail)}</div>`).join('')}
      <h3>Imported by (${(importedBy.get(f.path) || []).length})</h3><ul>${(importedBy.get(f.path) || []).map((p) => `<li>${fileLink(p)}</li>`).join('') || '<li class="hint">Nothing</li>'}</ul>`;
  } else {
    const f = d.data;
    const info = (DATA.folderInfo || {})[d.parent.data.path];
    const ins = importedBy.get(f.path) || [];
    el.innerHTML = `<h2>${esc(f.label)}</h2><div class="path">${esc(DATA.root)}/${esc(f.path)}</div>
      <p><span class="chip" style="background:${KIND_COLOR[f.kind] || KIND_COLOR.other}">${esc(f.kind)}</span>${f.selector ? ` <code>${esc(f.selector)}</code>` : ''}</p>
      ${info && info.purpose ? `<div class="purpose"><span class="hint">Folder:</span> ${esc(info.purpose)}</div>` : ''}
      ${carry && carry.methods ? carryAction(d) : ''}
      ${carry ? '' : '<div class="actions"><button class="btn" id="pickUp">Move to another folder…</button></div>'}
      ${d.violations.map((x) => `<div class="viol"><b>${esc(x.rule)}</b><br>${esc(x.detail)}<br><span class="hint">${esc(x.message || '')}</span></div>`).join('')}
      <h3>Imports (${f.imports.length})</h3><ul>${f.imports.map((p) => `<li>${fileLink(p)}</li>`).join('') || '<li class="hint">Nothing in the app</li>'}</ul>
      <h3>Imported by (${ins.length})</h3><ul>${ins.map((p) => `<li>${fileLink(p)}</li>`).join('') || '<li class="hint">Nothing</li>'}</ul>`;
  }
  el.querySelectorAll('[data-loc]').forEach((a) => (a.onclick = () => locate(a.dataset.loc)));
  bindActions(d);
}

// ---------- setup ----------
const defs = svg.append('defs');
for (const dir of ['out', 'in']) {
  defs.append('marker').attr('id', `arrow-${dir}`).attr('viewBox', '0 0 10 10').attr('refX', 9).attr('refY', 5)
    .attr('markerWidth', 7).attr('markerHeight', 7).attr('orient', 'auto-start-reverse')
    .append('path').attr('d', 'M0,0 L10,5 L0,10 z').attr('fill', dir === 'out' ? 'var(--accent)' : 'var(--warn)');
}
function resize() {
  const r = document.getElementById('canvas').getBoundingClientRect();
  W = r.width; H = r.height;
  if (root) zoomTo(view);
}
window.addEventListener('resize', resize);
resize();
legend();
api('GET', '/api/map').then((data) => load(data, '')).catch((e) => {
  document.getElementById('panel').innerHTML = `<p class="error">Could not load the map: ${esc(e.message)}</p>`;
});
</script>
</body>
</html>
