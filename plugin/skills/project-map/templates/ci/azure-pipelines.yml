# azure-pipelines-project-map.yml  (or add these steps to your existing pipeline)
# - Pull requests: fail only when the PR introduces NEW structure rule issues.
# - Builds of main (after a merge): regenerate the main map in docs/ and commit it. Only CI writes it.
# Permissions: the build identity ("<Project> Build Service") needs "Contribute" on the repository and,
# if main has branch policies, "Bypass policies when pushing". Otherwise use the alternative at the bottom.
trigger:
  branches:
    include: [main]

pr:
  branches:
    include: ['*']

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
    fetchDepth: 0              # full history: the check compares with the branch point on main
    persistCredentials: true   # lets the main build push the regenerated map

  - task: NodeTool@0
    inputs:
      versionSpec: '22.x'

  - script: npm run map:check
    displayName: Project map check (only new issues fail)
    condition: eq(variables['Build.Reason'], 'PullRequest')

  - script: |
      npm run map:main
      if [ -n "$(git status --porcelain -- docs/PROJECT_MAP.md docs/project-map.json)" ]; then
        git config user.name "project-map-bot"
        git config user.email "project-map-bot@example.com"
        git add docs/PROJECT_MAP.md docs/project-map.json
        git commit -m "chore: update project map [skip ci]"
        git push origin HEAD:main
      fi
    displayName: Regenerate the main map
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'), eq(variables['Build.SourceBranch'], 'refs/heads/main'))

# Alternative if CI may not push to main: publish the map as a build artifact instead of committing it,
# and let developers keep the committed map current with `npm run map:main` in a periodic small PR.
#  - publish: docs
#    artifact: project-map
