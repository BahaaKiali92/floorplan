# Add to .gitlab-ci.yml
# - Merge requests: fail only on NEW structure rule issues.
# - main: regenerate and commit the main map (needs a project access token with write_repository in PROJECT_MAP_TOKEN).
# - Merge request comment: set PROJECT_MAP_TOKEN with the api scope too (optional; without it only the check runs).
project-map-check:
  image: node:22
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    GIT_DEPTH: 0
  script:
    - git fetch origin main
    - |
      status=0
      node scripts/project-map/generate-map.mjs --check --pr-comment project-map-comment.md || status=$?
      if [ -n "$PROJECT_MAP_TOKEN" ]; then
        node -e 'process.stdout.write(JSON.stringify({ body: require("fs").readFileSync("project-map-comment.md", "utf8") }))' > pm-note.json
        curl -s -o /dev/null -X POST -H "PRIVATE-TOKEN: $PROJECT_MAP_TOKEN" -H "Content-Type: application/json" --data @pm-note.json \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests/$CI_MERGE_REQUEST_IID/notes" || true
      fi
      exit $status

project-map-main:
  image: node:22
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_COMMIT_MESSAGE !~ /\[skip ci\]/
  variables:
    GIT_DEPTH: 0
  script:
    - node scripts/project-map/generate-map.mjs --main
    - |
      OUT=$(node scripts/project-map/generate-map.mjs --outputs)   # the map paths from project-map.config.mjs
      if [ -n "$(git status --porcelain -- $OUT)" ]; then
        git config user.name "project-map-bot"
        git config user.email "project-map-bot@example.com"
        git add $OUT
        git commit -m "chore: update project map [skip ci]"
        git push "https://oauth2:${PROJECT_MAP_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" HEAD:main
      fi
